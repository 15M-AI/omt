[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-mind-tui"
version = "0.1.0"
description = "A keyboard-friendly local terminal interface for Open Mind models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Open Mind contributors" }]
dependencies = []

[project.scripts]
open-mind-tui = "open_mind_tui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
